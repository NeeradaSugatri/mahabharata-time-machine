<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Timeline | Mahabharata Time Machine
    </title>

    <link
        rel="stylesheet"
        href="css/timeline.css"
    >

</head>


<body>


    <!-- ========================================
         TIMELINE HEADER
    ========================================= -->

    <header class="timeline-header">


        <!-- Back to Home -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Home
        </a>


        <!-- Back to Map
             Hidden unless user came from Map -->

        <a
            href="map.html"
            class="back-link map-back-link"
            id="back-to-map"
            hidden
        >
            ← Map
        </a>


        <!-- Header Title -->

        <div class="header-title">

            <p class="eyebrow">
                THE JOURNEY
            </p>

            <h1>
                Mahabharata Timeline
            </h1>

            <p>
                Travel through the major events of the epic.
            </p>

        </div>


    </header>



    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main>


        <!-- Timeline Introduction -->

        <section class="timeline-intro">

            <p class="eyebrow">
                EXPLORE THE EPIC
            </p>

            <h2>
                A Journey Through Time
            </h2>

            <p>
                Select an event to discover its story,
                characters, location and consequences.
            </p>

        </section>



        <!-- Timeline Events -->

        <section
            id="timeline-container"
            class="timeline-container"
        >

        </section>


    </main>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

        <p>
            Mahabharata Time Machine • Explore • Learn • Discover
        </p>

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/data/events.js"></script>

    <script src="js/timeline.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Interactive Story | Mahabharata Time Machine
    </title>

    <link
        rel="stylesheet"
        href="css/missions.css"
    >
</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="story-header">

        <a
            href="event.html?id=dice-game"
            class="back-link"
        >
            ← Back to Event
        </a>


        <div class="story-title">

            <p class="eyebrow">
                INTERACTIVE STORY
            </p>

            <h1 id="mission-title">
                The Dice Game
            </h1>

            <p id="mission-subtitle">
                Enter the Royal Assembly
            </p>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="story-main">


        <!-- =========================
             STORY SCENE
        ========================== -->

        <section class="story-scene">


            <!-- =========================
                 MAIN VISUAL
            ========================== -->

            <div
                id="scene-visual"
                class="scene-visual"
            >


                <!-- =========================
                     CHARACTER
                ========================== -->

                <div
                    id="character-stage"
                    class="character-stage"
                >
                </div>


                <!-- =========================
                     CHARACTER DIALOGUE
                ========================== -->

                <div
                    id="character-dialogue"
                    class="character-dialogue"
                >

                    <div
                        id="dialogue-speaker"
                        class="dialogue-speaker"
                    >
                        Narrator
                    </div>


                    <p
                        id="dialogue-text"
                        class="dialogue-text"
                    >
                        Loading story...
                    </p>

                </div>

            </div>



            <!-- =========================
                 NARRATOR
            ========================== -->

            <div
                id="narrator-panel"
                class="narrator-panel"
            >

                <div class="narrator-label">
                    NARRATOR
                </div>


                <p
                    id="narrator-text"
                    class="narrator-text"
                >
                </p>

            </div>


<!-- =========================
     STORY CONTROLS
========================= -->
<div class="scene-controls">

    <button
        id="previous-button"
        type="button"
    >
        ← Previous
    </button>

    <span
        id="scene-counter"
        class="scene-counter"
    >
        Scene 1 / 15
    </span>

    <button
        id="next-button"
        type="button"
    >
        Next →
    </button>

</div>

</section>


        <!-- =========================
             STORY COMPLETE
        ========================== -->

        <section
            id="story-complete"
            class="story-complete"
            hidden
        >

            <p class="eyebrow">
                STORY COMPLETE
            </p>


            <h2>
                You have witnessed the Dice Game
            </h2>


            <p id="completion-text">
                You have completed the interactive story.
            </p>


            <button
                id="quiz-button"
                class="primary-button"
                type="button"
            >
                Take the Quiz →
            </button>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Mahabharata Time Machine
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/data/missions.js"></script>

    <script src="js/mission.js"></script>


</body>

</html>
